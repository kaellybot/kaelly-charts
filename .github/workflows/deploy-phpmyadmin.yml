name: Deploy phpMyAdmin

on:
  push:
    tags:        
      - '*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Kubernetes context
        run: |
          mkdir -p ${HOME}/.kube
          echo "${{ secrets.KUBECONFIG }}" > ${HOME}/.kube/config

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.0

      # Bitnami no longer publishes free image updates, so phpMyAdmin moved to
      # the official image; the former Helm release must go first because its
      # Deployment selector differs and cannot be patched in place.
      - name: Remove former Bitnami release
        run: |
          if helm status phpmyadmin --namespace mysql > /dev/null 2>&1; then
            helm uninstall phpmyadmin --namespace mysql --wait
          fi

      - name: Deploy phpMyAdmin
        env:
          PHPMYADMIN_HOST: ${{ secrets.PHPMYADMIN_HOST }}
        run: |
          envsubst '${PHPMYADMIN_HOST}' < phpmyadmin/phpmyadmin.yaml | kubectl apply -f -
          kubectl rollout restart deployment/phpmyadmin --namespace mysql
          kubectl rollout status deployment/phpmyadmin --namespace mysql --timeout=180s